<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIEL Studio</title>
  <meta name="description" content="Révisions du BTS CIEL option A">
  <meta name="theme-color" content="#000000">
  <!-- iPhone : ouverture en plein écran, sans barre Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CIEL Studio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: #f5f5f7; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
      padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
    #ecran { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #000; text-align: center; padding: 24px; transition: opacity .35s; z-index: 2; }
    #ecran.cache { opacity: 0; pointer-events: none; }
    .logo { width: 76px; height: 76px; border-radius: 50%; background: #ff453a; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 42px; color: #fff; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.04em; }
    p { margin: 0; color: #8e8e96; font-size: .95rem; line-height: 1.45; max-width: 320px; }
    .barre { width: 160px; height: 3px; background: #131316; border-radius: 3px; overflow: hidden; }
    .barre i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ff453a, #3d6bff);
      border-radius: 3px; animation: va 1.2s ease-in-out infinite alternate; }
    @keyframes va { from { transform: translateX(-60%); } to { transform: translateX(210%); } }
    .boutons { display: none; flex-direction: column; gap: 10px; margin-top: 6px; }
    .boutons.visible { display: flex; }
    .btn { display: block; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: .95rem; text-decoration: none;
      border: 1px solid rgba(255,255,255,.18); color: #f5f5f7; background: transparent; cursor: pointer; }
    .btn.plein { background: #f5f5f7; color: #000; border-color: #f5f5f7; }
  </style>
</head>
<body>
  <div id="ecran">
    <div class="logo">C</div>
    <h1>CIEL Studio</h1>
    <p id="message">Chargement de tes révisions…</p>
    <div class="barre" id="barre"><i></i></div>
    <div class="boutons" id="boutons">
      <button class="btn plein" onclick="location.reload()">Réessayer</button>
      <a class="btn" id="lien-site" target="_blank" rel="noopener">Ouvrir dans le navigateur</a>
    </div>
  </div>
  <iframe id="app" title="CIEL Studio" allow="clipboard-write; fullscreen"></iframe>

  <script>
    // ─── LA SEULE LIGNE À MODIFIER si l'adresse du site change ───
    const ADRESSE_SITE = "https://site-bts-ciel.streamlit.app/";

    const ecran = document.getElementById("ecran");
    const message = document.getElementById("message");
    const boutons = document.getElementById("boutons");
    const barre = document.getElementById("barre");
    const cadre = document.getElementById("app");
    document.getElementById("lien-site").href = ADRESSE_SITE;

    function probleme(texte) {
      message.textContent = texte;
      barre.style.display = "none";
      boutons.classList.add("visible");
      ecran.classList.remove("cache");
    }

    if (!navigator.onLine) {
      probleme("Pas de connexion internet. Reconnecte-toi puis réessaie.");
      window.addEventListener("online", () => location.reload());
    } else {
      // « ?p=vocabulaire » ouvre directement une page (raccourcis de l'icône)
      const url = new URL(ADRESSE_SITE);
      url.searchParams.set("embed", "true");
      const page = new URLSearchParams(location.search).get("p");
      if (page) url.searchParams.set("p", page);
      cadre.src = url.toString();

      let charge = false;
      cadre.addEventListener("load", () => {
        charge = true;
        setTimeout(() => ecran.classList.add("cache"), 600);
      });
      // Le site gratuit s'endort quand personne ne l'utilise : le réveil peut prendre jusqu'à une minute
      setTimeout(() => {
        if (!charge) message.textContent = "Le site se réveille, ça peut prendre jusqu'à une minute…";
      }, 8000);
      setTimeout(() => {
        if (!charge) probleme("Le site met trop de temps à répondre. Réessaie, ou ouvre-le dans le navigateur pour le réveiller.");
      }, 75000);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
